---
- name: Installing multiple packages
  hosts: frontend
  become: true
  tasks:
    - name: Install packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
      loop:
        - { name: "nginx", state: "present"}
        - { name: "docker", state: "present"}
        - { name: "git", state: "present"}