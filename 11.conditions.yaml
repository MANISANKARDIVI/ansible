---
- name: conditions in ansible
  hosts: local
  connection: local
  become: true
  vars:
    NUMBER: 790

  tasks:
    - name : print number is lesser than  to 100
      ansible.builtin.debug:
        msg: "Given number is {{ NUMBER }} is lesser than to 100"
      when: NUMBER < 100

    - name: print number is greater than to 100
      ansible.builtin.debug:
        msg: "Given number is {{ NUMBER }} is greater than to 100"
      when: NUMBER > 100