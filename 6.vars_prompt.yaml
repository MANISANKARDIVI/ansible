---
- name: Variables in ansible
  hosts: local
  connection: local
  become: true
  vars_prompt:              # This keyword used for vars_prompt
    - name: USERNAME
      prompt: Enter Your Username
      private: false        # In terminal username display while typing

    - name: PASSWORD
      prompt: Enter Your password
      private: true         # In terminal password wont display while typing

  tasks:
    - name: Variables for passing through terminal
      ansible.builtin.debug:
        msg: "You Entered username: {{ USERNAME }} and password: {{ PASSWORD }}"